    function findTransactionalMessageIndex(chat, role, text, requestId, minIndex = 0) {
      if (!Array.isArray(chat) || !chat.length) return -1;
      const expectedText = String(text || '').trim();
      const expectedReqId = String(requestId || '');
      const isUser = role === 'user';
      for (let index = chat.length - 1; index >= minIndex; index -= 1) {
        const item = chat[index];
        if (!item || Boolean(item.is_user) !== isUser) continue;
        const reqId = String(item?.extra?.hatsuRequestId || '');
        const mes = String(item?.mes || '').trim();
        if (expectedReqId && reqId === expectedReqId) return index;
        if (expectedText && mes === expectedText) return index;
      }
      return -1;
    }

    async function waitForTransactionalMessage(role, text, requestId, minIndex = 0) {
      for (let attempts = 0; attempts < 8; attempts += 1) {
        const context = getContext();
        const index = findTransactionalMessageIndex(context?.chat, role, text, requestId, minIndex);
        if (index >= 0) return index;
        await new Promise((resolve) => setTimeout(resolve, 30));
      }
      return -1;
    }

    function decodeToolDumpText(value) {
      return String(value || '')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&');
    }

    function looksLikeToolCallDump(value) {
      const text = String(value || '');
      return /Tool calls:/i.test(text)
        && (/<details\b/i.test(text) || /"name"\s*:/.test(text) || /"content"\s*:/.test(text));
    }

    function storyFromToolArguments(name, args) {
      if (/^generateimage$/i.test(String(name || ''))) return '';
      let parsed = args;
      if (typeof parsed === 'string') {
        const trimmed = parsed.trim();
        if (!trimmed) return '';
        try {
          parsed = JSON.parse(trimmed);
        } catch (e) {
          return trimmed;
        }
      }
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return '';
      for (const key of ['content', 'text', 'story', 'message']) {
        if (typeof parsed[key] === 'string' && parsed[key].trim()) return parsed[key].trim();
      }
      return '';
    }

    function pickToolStory(records) {
      let named = '';
      let fallback = '';
      for (const record of records) {
        const story = storyFromToolArguments(record && record.name, record && record.args);
        if (!story) continue;
        if (/game_content/i.test(String(record.name || ''))) {
          if (story.length > named.length) named = story;
        } else if (story.length > fallback.length) {
          fallback = story;
        }
      }
      return named || fallback;
    }

    function collectToolCallRecords(source, records, seen) {
      if (!source || typeof source !== 'object') return;
      if (seen.has(source)) return;
      seen.add(source);
      const calls = Array.isArray(source.tool_calls)
        ? source.tool_calls
        : (Array.isArray(source.toolCalls) ? source.toolCalls : null);
      if (calls) {
        for (const call of calls) {
          if (!call || typeof call !== 'object') continue;
          const fn = call.function && typeof call.function === 'object' ? call.function : call;
          records.push({
            name: fn.name || call.name || '',
            args: fn.arguments != null ? fn.arguments : (fn.args != null ? fn.args : (call.arguments != null ? call.arguments : (call.parameters != null ? call.parameters : call.input)))
          });
        }
      }
      const invocations = Array.isArray(source.tool_invocations)
        ? source.tool_invocations
        : (source.extra && Array.isArray(source.extra.tool_invocations) ? source.extra.tool_invocations : null);
      if (invocations) {
        for (const invocation of invocations) {
          if (!invocation || typeof invocation !== 'object') continue;
          records.push({
            name: invocation.name || '',
            args: invocation.parameters != null ? invocation.parameters : invocation.arguments
          });
        }
      }
      if (source.message && typeof source.message === 'object') collectToolCallRecords(source.message, records, seen);
      if (Array.isArray(source.choices)) {
        for (const choice of source.choices) {
          if (choice && choice.message) collectToolCallRecords(choice.message, records, seen);
        }
      }
      if (Array.isArray(source.content)) {
        for (const part of source.content) {
          if (!part || typeof part !== 'object') continue;
          if (part.type === 'tool_use' || part.input || part.functionCall) {
            const call = part.functionCall || part;
            records.push({
              name: call.name || '',
              args: call.input != null ? call.input : (call.args != null ? call.args : call.arguments)
            });
          }
        }
      }
    }

    function extractStoryFromToolDumpText(value) {
      const text = String(value || '');
      if (!/Tool calls:/i.test(text) && !/"name"\s*:\s*"game_content"/i.test(text)) return '';
      const codeMatch = text.match(/<code\b[^>]*>([\s\S]*?)<\/code>/i);
      const source = decodeToolDumpText(codeMatch ? codeMatch[1] : text);
      const startArray = source.indexOf('[');
      const startObject = source.indexOf('{');
      const start = startArray >= 0 && (startObject < 0 || startArray < startObject) ? startArray : startObject;
      if (start < 0) return '';
      let parsed = null;
      try {
        parsed = JSON.parse(source.slice(start));
      } catch (e) {
        return '';
      }
      const list = Array.isArray(parsed) ? parsed : [parsed];
      const records = [];
      for (const item of list) {
        if (!item || typeof item !== 'object') continue;
        const fn = item.function && typeof item.function === 'object' ? item.function : null;
        records.push({
          name: item.name || (fn && fn.name) || '',
          args: item.parameters != null ? item.parameters : (item.arguments != null ? item.arguments : (fn && fn.arguments))
        });
      }
      return pickToolStory(records);
    }

    function extractStoryFromToolPayload(source) {
      if (typeof source === 'string') return extractStoryFromToolDumpText(source);
      const records = [];
      collectToolCallRecords(source, records, new Set());
      return pickToolStory(records);
    }

    function preferReadableReply(body, source) {
      const text = String(body || '').trim();
      const toolText = String(extractStoryFromToolPayload(source) || extractStoryFromToolDumpText(text) || '').trim();
      if (!text) return toolText;
      if (toolText && looksLikeToolCallDump(text)) return toolText;
      return text;
    }

    function extractReplyTextFromGenerated(generated) {
      if (typeof generated === 'string') return preferReadableReply(generated, generated);
      if (!generated || typeof generated !== 'object') return '';
      // 酒馆 Generate 常返回 `new String(text)` 包装对象 (typeof 为 'object')，
      // 直接 String() 取回原文，否则会被当成空字符串漏掉。
      if (generated instanceof String) return preferReadableReply(String(generated), generated);
      const wrapped = (generated.valueOf && typeof generated.valueOf() === 'string') ? String(generated.valueOf()).trim() : '';
      if (wrapped && !looksLikeToolCallDump(wrapped)) return wrapped;
      let body = wrapped;
      const candidates = [
        generated.text,
        generated.mes,
        generated.message,
        generated.content
      ];
      if (!body) {
        for (const candidate of candidates) {
          const text = typeof candidate === 'string' ? candidate.trim() : '';
          if (text) {
            body = text;
            break;
          }
        }
      }
      if (!body && Array.isArray(generated.swipes) && generated.swipes.length > 0) {
        body = String(generated.swipes[generated.swipe_id] || generated.swipes[0] || '').trim();
      }
      return preferReadableReply(body, generated);
    }

    function selectCommittedReplyForPrompt(promptText, generatedText) {
      const prompt = String(promptText || '');
      const reply = String(generatedText || '').trim();
      if (!prompt.includes('[HATSU_OUTPUT_MODE:NIA_PRODUCER_WORK]')) return reply;
      const pattern = /<NIA_WORK_RESULT>[\s\S]*?<\/NIA_WORK_RESULT>/gi;
      let selected = '';
      let match;
      while ((match = pattern.exec(reply)) !== null) selected = String(match[0] || '').trim();
      return selected;
    }


    function getGenerationPayloadRequestId(generated) {
      if (!generated || typeof generated !== 'object') return '';
      return String(
        generated.generation_id
        || generated.generationId
        || generated.requestId
        || generated.request_id
        || generated.id
        || ''
      );
    }

    function isGenerationEndedPayloadForRequest(generated, requestId) {
      const reqId = String(requestId || '');
      const eventReqId = getGenerationPayloadRequestId(generated);
      return Boolean(reqId && eventReqId && eventReqId === reqId);
    }

    function normalizeGenerationEndedText(generated, requestId) {
      const reqId = String(requestId || '');
      const eventReqId = getGenerationPayloadRequestId(generated);
      if (eventReqId && reqId && eventReqId !== reqId) return null;
      return extractReplyTextFromGenerated(generated);
    }

    function readBeatChoiceOptions(choiceBody) {
      const closed = [...String(choiceBody || '').matchAll(/<option\b[^>]*>([\s\S]*?)<\/option>/gi)]
        .map((item) => String(item[1] || '').trim())
        .filter(Boolean);
      if (closed.length === 4) return closed;
      const loose = String(choiceBody || '').split(/<option\b[^>]*>/i).slice(1)
        .map((part) => part.replace(/<\/option\s*>/ig, '').replace(/<\/choice\s*>/ig, '').trim())
        .filter(Boolean);
      return loose.length === 4 ? loose : closed;
    }

    function hasCompleteOptionPayload(text) {
      const value = String(text || '');
      const choiceMatch = value.match(/<choice\b[^>]*>([\s\S]*?)<\/choice>/i);
      if (choiceMatch && readBeatChoiceOptions(choiceMatch[1]).length === 4) return true;
      return /<option1\b[^>]*>[\s\S]*?<\/option1>/i.test(value)
        && /<option2\b[^>]*>[\s\S]*?<\/option2>/i.test(value)
        && /<option3\b[^>]*>[\s\S]*?<\/option3>/i.test(value)
        && /<option4\b[^>]*>[\s\S]*?<\/option4>/i.test(value);
    }

    function isGeneratedTextCompatibleWithPrompt(promptText, generatedText) {
      const prompt = String(promptText || '');
      const reply = String(generatedText || '')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&')
        .trim();
      if (!reply) return false;
      // Explicit data contracts take priority over tag examples (including
      // "do not output" examples) in the prompt.
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_PRODUCER_WORK]')) {
        return /<NIA_WORK_RESULT>[\s\S]*?<\/NIA_WORK_RESULT>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_ONLINE_LIVE]')) {
        return /<NIA_LIVE_SEGMENT>[\s\S]*?<\/NIA_LIVE_SEGMENT>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_TV_PROGRAM]')) {
        return /<NIA_TV_PROGRAM>[\s\S]*?<\/NIA_TV_PROGRAM>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_SCHOOL_RADIO]')) {
        return /<NIA_RADIO>[\s\S]*?<\/NIA_RADIO>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_AUDITION_BEAT]')) {
        return /<NIA_AUDITION_BEAT>[\s\S]*?<\/NIA_AUDITION_BEAT>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_FAN_MILESTONE_EVENT]')) {
        return /<NIA_FAN_MILESTONE_EVENT>[\s\S]*?<\/NIA_FAN_MILESTONE_EVENT>/i.test(reply);
      }
      if (prompt.includes('[HATSU_OUTPUT_MODE:NIA_PLAN]')) {
        return /<NIA_PLAN>[\s\S]*?<\/NIA_PLAN>/i.test(reply);
      }
      if (/<beat\b/i.test(prompt) && /<choice\b/i.test(prompt)) {
        return /<beat\b/i.test(reply) || /<choice\b/i.test(reply);
      }
      const firstChoiceLabel = '\u7b2c\u4e00\u8f6e\u9009\u62e9';
      const interactionChoiceLabel = '\u4e92\u52a8\u5206\u652f\u8bbe\u8ba1';
      const bondEventLabel = '\u7f81\u7eca\u4e8b\u4ef6';
      const promptHasOptionSeed = /<option1\b/i.test(prompt);
      const expectsFirstChoice = prompt.includes(firstChoiceLabel) && promptHasOptionSeed;
      const expectsChoicePayload = expectsFirstChoice
        || (prompt.includes(interactionChoiceLabel) && promptHasOptionSeed)
        || (prompt.includes(bondEventLabel) && promptHasOptionSeed);
      if (expectsChoicePayload && !hasCompleteOptionPayload(reply)) return false;
      return true;
    }
    function findLatestAssistantReply(chat, requestId = '', minIndex = 0, startedAt = 0) {
      if (!Array.isArray(chat)) return null;
      const reqId = String(requestId || '');
      const mainDoc = getHostMainDocument();
      for (let index = chat.length - 1; index >= minIndex; index -= 1) {
        const message = chat[index];
        if (!message || message.is_user) continue;
        const messageReqId = String(message?.extra?.hatsuRequestId || '');
        if (reqId && messageReqId && messageReqId !== reqId) continue;
        const messageAt = Number(message?.send_date || 0);
        if (startedAt > 0 && Number.isFinite(messageAt) && messageAt > 0 && messageAt + 5 < startedAt) continue;
        const rawText = getMessageRawText(message).trim();
        const renderedText = String(mainDoc.querySelector(`.mes[mesid="${index}"] .mes_text`)?.innerText || '').trim();
        const text = rawText.length >= renderedText.length ? rawText : renderedText;
        if (!text) continue;
        const score =
          (reqId && messageReqId === reqId ? 3 : 0)
          + (index >= minIndex ? 2 : 0)
          + (startedAt > 0 && Number.isFinite(messageAt) && messageAt >= startedAt ? 1 : 0);
        return { index, text, rawText, renderedText, score };
      }
      return null;
    }

    async function waitForLatestAssistantReply(requestId = '', minIndex = 0, startedAt = 0) {
      let fallback = null;
      for (let attempts = 0; attempts < 10; attempts += 1) {
        const context = getContext();
        const hit = findLatestAssistantReply(context?.chat, requestId, minIndex, startedAt);
        if (hit && hit.score >= 3) return hit;
        if (hit && !fallback) fallback = hit;
        await new Promise((resolve) => setTimeout(resolve, 40));
      }
      return fallback;
    }

    function removeGeneratedAssistantMessagesAfter(startIndex, requestId = '') {
      const context = getContext();
      const chat = context?.chat;
      if (!Array.isArray(chat)) return 0;
      const reqId = String(requestId || '');
      let removed = 0;
      for (let index = chat.length - 1; index >= Math.max(0, Number(startIndex) || 0); index -= 1) {
        const message = chat[index];
        if (!message || message.is_user) continue;
        const messageReqId = String(message?.extra?.hatsuRequestId || '');
        if (messageReqId && reqId && messageReqId === reqId) continue;
        chat.splice(index, 1);
        removed += 1;
      }
      if (removed > 0) {
        context.chatMetadata && (context.chatMetadata.tainted = true);
      }
      return removed;
    }

    function renderSilentFloor(messageId) {
      // 把单个楼层渲染进酒馆 DOM，使其真正显示内容（之前只 push 进 chat 数组，
      // 不调用 addOneMessage，导致酒馆里楼层是空的）。addOneMessage 只渲染单条，
      // 不会像 printMessages 那样重绘全部楼层，所以不会让被隐藏的旧楼层冒出来。
      try {
        const context = getContext();
        const chat = context?.chat;
        const idx = Number(messageId);
        if (!Array.isArray(chat) || !Number.isInteger(idx) || idx < 0 || idx >= chat.length) return;
        if (typeof context.addOneMessage !== 'function') return;
        const mainDoc = getHostMainDocument();
        const already = mainDoc.querySelector(`#chat > .mes[mesid="${idx}"]`);
        if (already) {
          const mesText = already.querySelector('.mes_text');
          if (mesText && !String(mesText.innerText || '').trim() && String(chat[idx]?.mes || '').trim()) {
            // 楼层已存在但内容为空：补回内容。
            mesText.innerHTML = context.messageFormatting
              ? context.messageFormatting(String(chat[idx].mes || ''), chat[idx].name, false, Boolean(chat[idx].is_user), idx)
              : String(chat[idx].mes || '');
          }
          return;
        }
        context.addOneMessage(chat[idx], { scroll: false, forceId: idx });
      } catch (error) {
        // 渲染失败不影响事务主流程。
      }
      if (useVisualHideFloors) adjustMessageVisibility();
    }

    function stampTransactionalExtra(messageId, role, requestId, attempt) {
      const context = getContext();
      const targetMessage = context?.chat?.[messageId];
      if (targetMessage) {
        const attemptKey = String(attempt?.attemptKey || '');
        const saveScope = String(attempt?.saveScope || '');
        targetMessage.extra = {
          ...(targetMessage.extra || {}),
          hatsuRequestId: String(requestId || ''),
          hatsuTxnRole: role,
          hatsuTxnAt: targetMessage?.extra?.hatsuTxnAt || Date.now(),
          ...(attemptKey ? { hatsuAttemptKey: attemptKey } : {}),
          ...(saveScope ? { hatsuSaveScope: saveScope } : {}),
          ...(attemptKey && role === 'user' ? { _acu_true_same_layer: true } : {})
        };
        if (attemptKey && role === 'user') targetMessage.is_hidden = true;
      }
      context && context.chatMetadata && (context.chatMetadata.tainted = true);
    }

    async function createSilentChatMessage(role, text, requestId, attempt) {
      const context = getContext();
      if (!context || !Array.isArray(context.chat)) throw new Error('chat context unavailable');
      const reqId = String(requestId || '');

      // 优先走酒馆助手：{role,message} 格式 + refresh:'affected' 只刷新本楼，
      // 内容直接写入，不会出现空楼层，也不会触发全楼层重绘。
      const tavernHelper = getTavernHelper();
      if (tavernHelper && typeof tavernHelper.createChatMessages === 'function') {
        try {
          await tavernHelper.createChatMessages(
            [{
              role: role === 'user' ? 'user' : 'assistant',
              message: String(text || ''),
              extra: { hatsuRequestId: reqId, hatsuTxnRole: role, hatsuTxnAt: Date.now() }
            }],
            // refresh:'none' 与 index2 一致：只写入聊天数据、不触碰 DOM，
            // 因此不会把前端所在的楼层顶下去导致前端被重渲染（"顿一下"）。
            { refresh: 'none' }
          );
          const messageId = context.chat.length - 1;
          stampTransactionalExtra(messageId, role, reqId, attempt);
          return messageId;
        } catch (error) {
          console.warn('[st.html] TavernHelper.createChatMessages 失败，回退原生:', error);
        }
      }

      // 兜底：裸 getContext()，手动 push 后用 addOneMessage 单楼渲染。
      const message = buildTransactionalMessage(role, text, requestId);
      const beforeLength = context.chat.length;
      const createChatMessages = resolveCreateChatMessagesFn(context);
      let messageId = -1;
      if (createChatMessages) {
        await tryCreateByHostApi(createChatMessages, role, message);
        messageId = await waitForTransactionalMessage(role, message.mes, requestId, beforeLength);
      }
      if (messageId < 0) {
        context.chat.push(message);
        messageId = context.chat.length - 1;
      }
      stampTransactionalExtra(messageId, role, reqId, attempt);
      renderSilentFloor(messageId);
      return messageId;
    }

    function replaceAssistantMessageText(index, text, deps) {
      deps = deps && typeof deps === 'object' ? deps : {};
      const context = deps.context || getContext();
      const message = context?.chat?.[Number(index)];
      if (!message || message.is_user) throw new Error('assistant_message_unavailable');
      const value = String(text || '');
      message.mes = value;
      if (Array.isArray(message.swipes) && message.swipes.length > 0) {
        const swipeIndex = Number.isInteger(Number(message.swipe_id)) ? Number(message.swipe_id) : 0;
        message.swipes[swipeIndex] = value;
      }
      context.chatMetadata && (context.chatMetadata.tainted = true);
    }

    function rollbackSilentUserMessage(index, requestId) {
      const context = getContext();
      if (!context || !Array.isArray(context.chat)) return;
      const idx = Number(index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= context.chat.length) return;
      const message = context.chat[idx];
      if (!message?.is_user) return;
      if (String(message?.extra?.hatsuRequestId || '') !== String(requestId || '')) return;
      context.chat.splice(idx, 1);
      try {
        const mainDoc = getHostMainDocument();
        mainDoc.querySelector(`#chat > .mes[mesid="${idx}"]`)?.remove();
      } catch (error) {
        // 忽略 DOM 清理失败。
      }
    }

    async function rollbackSilentAssistantMessage(index, requestId, attempt) {
      const context = getContext();
      if (!context || !Array.isArray(context.chat)) return;
      const idx = Number(index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= context.chat.length) return;
      const message = context.chat[idx];
      if (!message || message.is_user) return;
      if (String(message?.extra?.hatsuRequestId || '') !== String(requestId || '')) return;
      const attemptKey = String(attempt?.attemptKey || '');
      if (attemptKey && String(message?.extra?.hatsuAttemptKey || '') !== attemptKey) return;
      context.chat.splice(idx, 1);
      context.chatMetadata && (context.chatMetadata.tainted = true);
      try {
        const mainDoc = getHostMainDocument();
        mainDoc.querySelector(`#chat > .mes[mesid="${idx}"]`)?.remove();
      } catch (error) {}
      await persistChatSilently();
    }

    async function persistChatSilently() {
      const context = getContext();
      await context?.saveChat?.();
    }

    function postCommittedReply(requestId, text, options = {}) {
      const messageId = resolveAssistantMessageId(options.messageId);
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'aiReplyCommitted',
        requestId: String(requestId || ''),
        channelLeaseId: String(options.channelLeaseId || pendingChannelLeaseId || ''),
        text: String(text || ''),
        rawText: String(options.rawText || text || ''),
        renderedText: String(options.renderedText || ''),
        isFinal: options.isFinal !== false,
        messageId: messageId >= 0 ? messageId : undefined
      };
      postToFrame(payload);
      dispatchCommittedReplyEvent(payload);
      if (String(pendingRequestId || '') === String(requestId || '')) {
        clearPendingReplyRequest();
      }
    }

    function postPrimaryAiError(requestId, channelLeaseId, error) {
      postToFrame({
        source: 'hatsuboshi-produce-host',
        type: 'primaryAiError',
        requestId: String(requestId || ''),
        channelLeaseId: String(channelLeaseId || ''),
        error: String(error?.message || error || 'primary_generation_failed')
      });
    }
    function normalizeSecondaryEnvelope(data, currentScope) {
      const jobId = String(data?.jobId || '').trim();
      const requestId = String(data?.requestId || '').trim();
      const saveScope = String(data?.saveScope || '').trim();
      const kind = String(data?.kind || '').trim();
      const prompt = String(data?.prompt || '').trim();
      const apiConfig = data?.apiConfig && typeof data.apiConfig === 'object' ? { ...data.apiConfig } : {};
      if (!jobId || !requestId || !saveScope || !kind || !prompt) {
        return { ok: false, reason: 'invalid_secondary_envelope' };
      }
      if (saveScope !== String(currentScope || '')) {
        return { ok: false, reason: 'secondary_scope_mismatch' };
      }
      return { ok: true, envelope: { jobId, requestId, saveScope, kind, prompt, apiConfig } };
    }

    function createSecondaryReplyPayload(envelope, text, options) {
      options = options && typeof options === 'object' ? options : {};
      return {
        source: 'hatsuboshi-produce-host',
        type: 'secondaryAiReply',
        jobId: String(envelope?.jobId || ''),
        requestId: String(envelope?.requestId || ''),
        saveScope: String(envelope?.saveScope || ''),
        kind: String(envelope?.kind || ''),
        text: String(text || ''),
        ok: options.ok !== false,
        error: String(options.error || ''),
        isFinal: true
      };
    }

    function postSecondaryReply(envelope, text, options = {}) {
      window.postMessage(createSecondaryReplyPayload(envelope, text, options), '*');
    }

    async function runSecondaryApiPrompt(envelope) {
    function classifySecondaryApiCompletion(json) {
      const choice = json?.choices?.[0];
      const text = String(choice?.message?.content || '').trim();
      const finishReason = String(choice?.finish_reason || '');
      if (finishReason === 'length') {
        return { text, ok: false, error: 'output_truncated', finishReason };
      }
      return {
        text,
        ok: Boolean(text),
        error: text ? '' : 'empty_response',
        finishReason
      };
    }
      if (getCurrentContextInfo().saveScope !== envelope.saveScope) return;
      const prompt = String(envelope.prompt || '').trim();
      const apiConfig = envelope.apiConfig || {};
      const baseUrl = String(apiConfig.baseUrl || '').trim().replace(/\/$/, '');
      const apiKey = String(apiConfig.apiKey || '').trim();
      const model = String(apiConfig.model || '').trim();
      const temperature = Number.isFinite(Number(apiConfig.temperature)) ? Number(apiConfig.temperature) : 0.7;
      const maxTokens = Number.isFinite(Number(apiConfig.maxTokens)) ? Number(apiConfig.maxTokens) : 1200;
      if (!baseUrl || !model) {
        postSecondaryReply(envelope, '', { ok: false, error: 'missing_config' });
        return;
      }
      const url = baseUrl.endsWith('/chat/completions') ? baseUrl : `${baseUrl}/chat/completions`;
      const isDirectorRequest = envelope.kind === 'director';
      const abortController = isDirectorRequest ? new AbortController() : null;
      let fetchTimeoutId = 0;
      let fetchTimedOut = false;
      if (abortController) {
        fetchTimeoutId = setTimeout(() => {
          fetchTimedOut = true;
          abortController.abort();
        }, SECONDARY_DIRECTOR_FETCH_TIMEOUT_MS);
      }
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
          body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature, max_tokens: maxTokens }),
          ...(abortController ? { signal: abortController.signal } : {})
        });
        if (getCurrentContextInfo().saveScope !== envelope.saveScope) return;
        if (!res.ok) {
          postSecondaryReply(envelope, '', { ok: false, error: `http_${res.status}` });
          return;
        }
        const json = await res.json();
        if (getCurrentContextInfo().saveScope !== envelope.saveScope) return;
        const completion = classifySecondaryApiCompletion(json);
        postSecondaryReply(envelope, completion.text, completion);
      } catch (error) {
        if (getCurrentContextInfo().saveScope !== envelope.saveScope) return;
        postSecondaryReply(envelope, '', {
          ok: false,
          error: fetchTimedOut ? 'director_timeout' : String(error?.message || error)
        });
      } finally {
        if (fetchTimeoutId) clearTimeout(fetchTimeoutId);
      }
    }
    async function runTransactionalViaTavernHelper(tavernHelper, promptText, reqId, channelLeaseId) {
      // 保存当前 user 楼层，让 {{lastUserMessage}} 和世界书扫描读取同一轮输入。
      // 直播省略额外的 user_input，避免助手又注入一份完整企划；失败仍按 requestId 回滚。
      //
      // generate() 的返回值偶尔不可靠/为空，但酒馆助手会在生成结束时发出
      // GENERATION_ENDED ('js_generation_ended') 事件并带上最终文本。仿 index2 的做法，
      // 用 [事件, generate 返回值, 超时] 做 race，谁先给出非空文本就用谁。
      const eventSource = getContext()?.eventSource;
      const GEN_ENDED = 'js_generation_ended';
      let endedResolve = null;
      const endedPromise = new Promise((resolve) => { endedResolve = resolve; });
      let endedWithoutText = false;
      const endedHandler = (finalText, generationId) => {
        try {
          const eventPayload = { text: finalText, generation_id: generationId };
          if (!isGenerationEndedPayloadForRequest(eventPayload, reqId)) return;
          const normalizedText = normalizeGenerationEndedText(eventPayload, reqId);
          if (normalizedText === null) return;
          if (normalizedText && !isGeneratedTextCompatibleWithPrompt(promptText, normalizedText)) return;
          endedWithoutText = !normalizedText;
          endedResolve(normalizedText);
        } catch (e) {}
      };
      let listening = false;
      const removeEndedListener = () => {
        if (!listening) return;
        try {
          if (typeof eventSource.removeListener === 'function') eventSource.removeListener(GEN_ENDED, endedHandler);
          else if (typeof eventSource.off === 'function') eventSource.off(GEN_ENDED, endedHandler);
        } catch (e) {}
        listening = false;
      };

      let userIndex = -1;
      try {
        userIndex = await createSilentChatMessage('user', promptText, reqId);
        await persistChatSilently();
      } catch (error) {
        if (userIndex >= 0) {
          rollbackSilentUserMessage(userIndex, reqId);
          try { await persistChatSilently(); } catch (persistError) {}
        }
        postCommittedReply(reqId, '', { isFinal: true, channelLeaseId });
        throw error;
      }
      if (eventSource && typeof eventSource.on === 'function') {
        try { eventSource.on(GEN_ENDED, endedHandler); listening = true; } catch (e) {}
      }
      let generatedText = '';
      try {
        const generatePromise = Promise.resolve(tavernHelper.generate({
          ...(/^\[HATSU_OUTPUT_MODE:(?:NIA_ONLINE_LIVE|NIA_SCHOOL_RADIO|NIA_TV_PROGRAM)\]/.test(promptText) ? {} : { user_input: promptText }),
          should_stream: false,
          // 不静默：与 index2 一致，让酒馆底部显示生成/停止标志。
          should_silence: false,
          generation_id: reqId
        }));
        const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve(''), 120000));
        const raced = await Promise.race([endedPromise, generatePromise, timeoutPromise]);
        generatedText = extractReplyTextFromGenerated(raced);
        if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        if (!generatedText && !endedWithoutText) {
          // race 先返回的是空：再等 generate 自身的返回值兜底。
          try {
            generatedText = extractReplyTextFromGenerated(await generatePromise);
            if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
          } catch (e) {}
        }
        if (!generatedText && listening && !endedWithoutText) {
          // generate 可能先返回空值，但真正正文稍后才通过 scoped end event 到达。
          const lateText = await Promise.race([
            endedPromise,
            timeoutPromise
          ]);
          generatedText = extractReplyTextFromGenerated(lateText);
          if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        }
      } catch (error) {
        removeEndedListener();
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true, channelLeaseId });
        throw error;
      }
      removeEndedListener();
      if (!generatedText) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true, channelLeaseId });
        return;
      }
      await createSilentChatMessage('assistant', generatedText, reqId);
      await persistChatSilently();
      const assistantMessageId = getContext()?.chat?.length - 1;
      postCommittedReply(reqId, generatedText, {
        isFinal: true,
        rawText: generatedText,
        renderedText: '',
        messageId: assistantMessageId,
        channelLeaseId
      });
    }

    async function runTransactionalPrompt(prompt, requestId, channelLeaseId) {
      const context = getContext();
      const promptText = String(prompt || '').trim();
      const reqId = String(requestId || '');
      if (!context || !promptText || !reqId) return;
      if (!requestPromptCache.has(reqId)) requestPromptCache.set(reqId, promptText);
      pendingRequestId = reqId;
      pendingChannelLeaseId = String(channelLeaseId || '');
      transactionalReplyRequestId = reqId;
      pendingPromptChatLength = Array.isArray(context.chat) ? context.chat.length : 0;
      clearReplyCandidateState();

      const tavernHelper = getTavernHelper();
      if (tavernHelper) {
        await runTransactionalViaTavernHelper(tavernHelper, promptText, reqId, channelLeaseId);
        return;
      }

      const txnStartedAt = Date.now();
      const userIndex = await createSilentChatMessage('user', promptText, reqId);
      await persistChatSilently();
      const assistantStartIndex = Array.isArray(context.chat) ? context.chat.length : 0;
      let generatedText = '';
      let existingAssistantHit = null;
      try {
        const generated = await context.generate?.('quiet');
        generatedText = extractReplyTextFromGenerated(generated);
        if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        if (!generatedText) {
          existingAssistantHit = await waitForLatestAssistantReply(reqId, assistantStartIndex, txnStartedAt);
          generatedText = existingAssistantHit?.text || '';
          if (generatedText && !isGeneratedTextCompatibleWithPrompt(promptText, generatedText)) generatedText = '';
        }
      } catch (error) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true, channelLeaseId });
        throw error;
      }
      if (!generatedText) {
        rollbackSilentUserMessage(userIndex, reqId);
        await persistChatSilently();
        postCommittedReply(reqId, '', { isFinal: true, channelLeaseId });
        return;
      }
      const assistantResolvedText = generatedText
        || existingAssistantHit?.rawText
        || existingAssistantHit?.renderedText
        || '';
      removeGeneratedAssistantMessagesAfter(assistantStartIndex, reqId);
      await createSilentChatMessage('assistant', assistantResolvedText, reqId);
      await persistChatSilently();
      const assistantMessageId = getContext()?.chat?.length - 1;
      postCommittedReply(reqId, assistantResolvedText, {
        isFinal: true,
        rawText: existingAssistantHit?.rawText || assistantResolvedText,
        renderedText: existingAssistantHit?.renderedText || '',
        messageId: assistantMessageId,
        channelLeaseId
      });
    }

    function postCharacterToFrame(targetWindow = null) {
      const contextInfo = getCurrentContextInfo();
      const savedState = getSavedChatState();
      console.log('[st.html] postCharacterToFrame sending payload:', contextInfo.character, 'hasSavedState:', Boolean(savedState));
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'character',
        character: contextInfo.character,
        saveScope: contextInfo.saveScope,
        hasSavedState: Boolean(savedState),
        savedState,
      };
      if (targetWindow && typeof targetWindow.postMessage === 'function') {
        targetWindow.postMessage(payload, '*');
      } else {
        postToFrame(payload);
      }
    }

    function sendPromptToSillyTavern(prompt) {
      const text = String(prompt || '').trim();
      if (!text) return;
      
      const mainDoc = window.parent?.document || document;
      const textarea = mainDoc.querySelector('#send_textarea');
      const sendButton = mainDoc.querySelector('#send_but');
      if (textarea && sendButton) {
        textarea.value = text;
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
        textarea.dispatchEvent(new Event('change', { bubbles: true }));
        pendingPromptSentAt = Date.now();
        const context = getContext();
        pendingPromptChatLength = Array.isArray(context?.chat) ? context.chat.length : 0;
        sendButton.click();
      }
    }

    function bindSillyTavernReplyBridge() {
      try {
        const context = getContext();
        if (!context) return;
        const eventSource = context.eventSource;
        const eventTypes = context.eventTypes;
        if (!eventSource || !eventTypes) return;

        const recordLifecycle = (status) => {
          if (!pendingRequestId) return;
          const current = hostGenerationAttemptDebug.current;
          if (current && String(current.requestId || '') === pendingRequestId) {
            current.status = status;
            postHostGenerationAttemptDebug();
          }
        };
        const handleGenerationEnd = (emptyReason, status) => {
          if (!pendingRequestId) return;
          recordLifecycle(status);
          const latestMessageId = getContext()?.chat?.length - 1;
          sendLatestAiReplyToFrame(latestMessageId, true, emptyReason);
        };

        eventSource.on(eventTypes.CHARACTER_MESSAGE_RENDERED, (messageId) => {
          sendLatestAiReplyToFrame(messageId, false);
        });
        if (eventTypes.GENERATION_STARTED) {
          eventSource.on(eventTypes.GENERATION_STARTED, () => {
            if (!pendingRequestId) return;
            clearReplyCandidateState();
            recordLifecycle('generating');
          });
        }
        if (eventTypes.STREAM_TOKEN_RECEIVED) {
          eventSource.on(eventTypes.STREAM_TOKEN_RECEIVED, () => {
            if (!pendingRequestId) return;
            recordLifecycle('streaming');
            const latestMessageId = getContext()?.chat?.length - 1;
            if (latestMessageId >= 0) {
              sendLatestAiReplyToFrame(latestMessageId, false);
            }
          });
        }
        if (eventTypes.GENERATION_ENDED) {
          eventSource.on(eventTypes.GENERATION_ENDED, () => handleGenerationEnd('host_ended_empty', 'ended'));
        }
        if (eventTypes.GENERATION_STOPPED) {
          eventSource.on(eventTypes.GENERATION_STOPPED, () => handleGenerationEnd('host_stopped_empty', 'stopped'));
        }
        if (eventTypes.MESSAGE_RECEIVED) {
          eventSource.on(eventTypes.MESSAGE_RECEIVED, (messageId) => {
            sendLatestAiReplyToFrame(messageId, true);
          });
        }
        if (eventTypes.MESSAGE_SWIPED) {
          eventSource.on(eventTypes.MESSAGE_SWIPED, (messageId) => {
            sendLatestAiReplyToFrame(messageId, true);
          });
        }
      } catch (error) {
        console.warn('[初星直接桥接] 无法绑定角色回复监听。', error);
      }
    }
    function sendLatestAiReplyToFrame(messageId, isFinal = true, emptyReason = '') {
      if (!pendingRequestId) return;
      if (transactionalReplyRequestId === pendingRequestId) return;
      collectAndSendAiReply(messageId, isFinal, { emptyReason });
    }

    function dispatchCommittedReplyEvent(payload) {
      try {
        window.dispatchEvent(new CustomEvent(HATSU_COMMIT_EVENT_NAME, { detail: payload }));
      } catch (error) {
        console.warn('[st.html] dispatch commit event failed:', error);
      }
    }

    function getMessageRawText(message) {
      if (!message || message.is_user) return '';
      const swipeIndex = Number.isInteger(message.swipe_id) ? message.swipe_id : 0;
      let rawText = '';
      if (Array.isArray(message.swipes) && message.swipes.length > 0) {
        rawText = String(message.swipes[swipeIndex] || message.swipes[0] || '');
      }
      if (!rawText) {
        rawText = typeof message.mes === 'string' ? message.mes : '';
      }
      const toolText = extractStoryFromToolPayload(message) || extractStoryFromToolDumpText(rawText);
      if (!String(rawText).trim()) return toolText;
      if (toolText && looksLikeToolCallDump(rawText)) return toolText;
      return rawText;
    }

    function findLatestUsableAiReplyId(preferredId) {
      const context = getContext();
      const chat = context?.chat;
      if (!Array.isArray(chat)) return Number(preferredId);
      const startIndex = Math.max(1, pendingPromptChatLength);
      const preferredIndex = Number(preferredId);
      if (Number.isInteger(preferredIndex) && preferredIndex >= startIndex) {
        return preferredIndex;
      }
      for (let index = chat.length - 1; index >= startIndex; index -= 1) {
        const message = chat[index];
        if (message && !message.is_user) return index;
      }
      return preferredIndex;
    }

    function collectAndSendAiReply(messageId, isFinal = true, options) {
      options = options && typeof options === 'object' ? options : {};
      if (Number(messageId) === 0 && !options.emptyReason) return;
      if (isFinal && pendingCandidateInFlight) return;
      
      const context = getContext();
      const replyMessageId = findLatestUsableAiReplyId(messageId);
      const message = context?.chat?.[replyMessageId];
      if (!message || message.is_user) {
        // generation end 可能早于 assistant 消息真正落到 chat，做有限次数的短延迟重试。
        if (isFinal) {
          const latestId = Array.isArray(context?.chat) ? context.chat.length - 1 : Number(messageId);
          if (options.emptyReason) handleEmptyFinalReply(latestId, options.emptyReason);
          else if (Number.isInteger(latestId) && latestId >= 0) scheduleReplyRetry(latestId, 350);
        }
        return;
      }

      const rawText = getMessageRawText(message);
      const mainDoc = window.parent?.document || document;
      const renderedText = mainDoc.querySelector(`.mes[mesid="${replyMessageId}"] .mes_text`)?.innerText || '';
      let text = rawText.length > renderedText.length ? rawText : renderedText;
      if (looksLikeToolCallDump(text) || looksLikeToolCallDump(renderedText) || looksLikeToolCallDump(rawText)) {
        const toolText = extractStoryFromToolPayload(message) || extractStoryFromToolDumpText(rawText) || extractStoryFromToolDumpText(renderedText);
        if (toolText) text = toolText;
      }

      if (!text.trim()) {
        // SillyTavern may render an empty assistant placeholder before generation produces text.
        if (isFinal && options.emptyReason) handleEmptyFinalReply(replyMessageId, options.emptyReason);
        else if (isFinal) scheduleReplyRetry(replyMessageId, 350);
        return;
      }
      pendingEmptyFinalRetryCount = 0;

      if (!isFinal) {
        // 部分宿主环境偶发不触发 GENERATION_STOPPED/MESSAGE_RECEIVED，防止前端永远停留在“生成中”
        scheduleStreamFinalize(replyMessageId, 1400);
      }

      if (text.trim().length > 0 || isFinal) {
        const payload = {
          source: 'hatsuboshi-produce-host',
          type: useCommittedReplyEvent && isFinal ? 'aiReplyCommitted' : 'aiReply',
          requestId: pendingRequestId,
          channelLeaseId: pendingChannelLeaseId,
          text,
          rawText,
          renderedText,
          isFinal,
          messageId: replyMessageId
        };
        window.postMessage(payload, '*');
        if (useCommittedReplyEvent && isFinal) {
          dispatchCommittedReplyEvent(payload);
        }
        
        if (isFinal) {
          clearStreamFinalizeTimer();
          pendingCandidateInFlight = true;
          pendingCandidateMessageId = Number(replyMessageId);
          scheduleReplyRetry(replyMessageId, 2500);
        }
      }
    }

    function handleEmptyFinalReply(messageId, reason = 'host_ended_empty', deps) {
      deps = deps && typeof deps === 'object' ? deps : {};
      if (!pendingRequestId) return 'ignored';
      const scheduleRetry = deps.scheduleReplyRetry || scheduleReplyRetry;
      const postError = deps.postPrimaryAiError || postPrimaryAiError;
      const clearPending = deps.clearPendingReplyRequest || clearPendingReplyRequest;
      const requestId = pendingRequestId;
      const channelLeaseId = pendingChannelLeaseId;
      const retryMessageId = Number(messageId);
      if (!Number.isInteger(retryMessageId) || retryMessageId < 0) {
        postError(requestId, channelLeaseId, new Error(reason));
        clearPending();
        return 'failed';
      }
      if (pendingEmptyFinalRetryCount < HOST_EMPTY_FINAL_MAX_RETRIES) {
        pendingEmptyFinalRetryCount += 1;
        scheduleRetry(retryMessageId, 350, reason);
        return 'retry';
      }
      postError(requestId, channelLeaseId, new Error(reason));
      clearPending();
      return 'failed';
    }
    function scheduleStreamFinalize(messageId, delay = 1200) {
      if (!pendingRequestId) return;
      if (!Number.isInteger(Number(messageId)) || Number(messageId) < 0) return;
      if (pendingStreamFinalizeTimer) window.clearTimeout(pendingStreamFinalizeTimer);
      pendingStreamMessageId = Number(messageId);
      pendingStreamFinalizeTimer = window.setTimeout(() => {
        pendingStreamFinalizeTimer = 0;
        const fallbackMessageId = pendingStreamMessageId;
        pendingStreamMessageId = -1;
        if (!pendingRequestId) return;
        collectAndSendAiReply(fallbackMessageId, true, { emptyReason: 'host_stream_idle_empty' });
      }, delay);
    }

    function clearStreamFinalizeTimer() {
      if (pendingStreamFinalizeTimer) window.clearTimeout(pendingStreamFinalizeTimer);
      pendingStreamFinalizeTimer = 0;
      pendingStreamMessageId = -1;
    }

    function getChatCompletionMessageText(message) {
      if (!message) return '';
      const content = Array.isArray(message.content)
        ? message.content.map(part => typeof part === 'string' ? part : part?.text || '').join('\n')
        : String(message.content || '');
      return content.trim();
    }

    function removeCurrentTransactionalDuplicateUserPrompt(chat, activeRequestId) {
      if (!activeRequestId || !Array.isArray(chat)) return false;
      const userIndexes = [];
      for (let index = chat.length - 1; index >= 0 && userIndexes.length < 2; index -= 1) {
        if (chat[index]?.role === 'user') userIndexes.push(index);
      }
      if (userIndexes.length < 2) return false;
      const [latestIndex, earlierIndex] = userIndexes;
      const latestText = getChatCompletionMessageText(chat[latestIndex]);
      const earlierText = getChatCompletionMessageText(chat[earlierIndex]);
      if (!latestText || latestText !== earlierText) return false;
      chat.splice(earlierIndex, 1);
      return true;
    }

    function isHatsuFrontendPromptMessage(message) {
      if (!message || message.role !== 'user') return false;
      const content = getChatCompletionMessageText(message);
      return content.includes('初星育成系统') || content.includes('【初星学园 Galgame 渲染规则契约】');
    }

    function ensureTrailingTemporaryUserTurn(chat) {
      if (!Array.isArray(chat) || chat.length === 0) return false;
      const lastIndex = chat.length - 1;
      const lastMessage = chat[lastIndex];
      if (!lastMessage || lastMessage.role === 'user') return false;
      chat.push({
        role: 'user',
        content: '\n',
        name: 'hatsu-trailing-turn'
      });
      return true;
    }

    function ensureTrailingTemporaryUserInGenerationSettings(eventData) {
      if (!eventData || typeof eventData !== 'object') return false;
      const candidates = [
        eventData.chat,
        eventData.messages,
        eventData.generate_data?.messages
      ];
      let changed = false;
      for (const messages of candidates) {
        if (Array.isArray(messages)) changed = ensureTrailingTemporaryUserTurn(messages) || changed;
      }
      return changed;
    }

    function installHatsuGenerationFetchFallback() {
      let hostWindow = window;
      try {
        if (window.parent && window.parent !== window) hostWindow = window.parent;
      } catch (e) {}
      try {
        // The wrapper must be constructed in the host realm. Assigning a
        // function created by this embedded frame to parent.fetch leaves the
        // host with a dead callback after the frame is reloaded.
        const HostFunction = hostWindow.Function;
        if (typeof HostFunction !== 'function') return;
        const createHostInstaller = HostFunction(`
          return function installHatsuTrailingUserFetchFix() {
            const stateKey = '__HATSU_GENERATION_FETCH_TURN_FIX_V2__';
            const existing = globalThis[stateKey];
            if (existing?.version === 2 && globalThis.fetch === existing.wrappedFetch) return;

            const originalFetch = existing?.originalFetch || globalThis.fetch;
            if (typeof originalFetch !== 'function') return;

            const hasHatsuMarker = function(payload) {
              try {
                const text = JSON.stringify(payload);
                return text.includes('<HATSU_ROUTE>')
                  || text.includes('<HATSU_CONTEXT>')
                  || text.includes('[HATSU_OUTPUT_MODE:');
              } catch (error) {
                return false;
              }
            };

            const appendTrailingUser = function(payload) {
              if (!payload || typeof payload !== 'object' || !hasHatsuMarker(payload)) return false;
              const candidates = [
                payload.chat,
                payload.messages,
                payload.generate_data?.messages
              ];
              let changed = false;
              for (const messages of candidates) {
                if (!Array.isArray(messages) || messages.length === 0) continue;
                const lastMessage = messages[messages.length - 1];
                if (lastMessage?.role === 'user') continue;
                messages.push({ role: 'user', content: '\\n', name: 'hatsu-trailing-turn' });
                changed = true;
              }
              return changed;
            };

            const wrappedFetch = function(input, init) {
              let nextInit = init;
              try {
                const url = typeof input === 'string' ? input : String(input?.url || '');
                const body = init?.body;
                if (/\\/api\\/backends\\/chat-completions\\/generate(?:\\?|$)/.test(url) && typeof body === 'string') {
                  const payload = JSON.parse(body);
                  if (appendTrailingUser(payload)) {
                    nextInit = { ...init, body: JSON.stringify(payload) };
                  }
                }
              } catch (error) {
                console.debug('[Hatsu ST] generation fetch turn fallback skipped:', error);
              }
              return Reflect.apply(originalFetch, globalThis, [input, nextInit]);
            };

            globalThis[stateKey] = { version: 2, originalFetch, wrappedFetch };
            globalThis.fetch = wrappedFetch;
          };
        `);
        createHostInstaller()();
      } catch (error) {
        console.warn('[Hatsu ST] unable to install generation fetch fallback:', error);
      }
    }

    function pruneHatsuChatCompletionPayload(eventData) {
      if (!eventData || !Array.isArray(eventData.chat)) return;
      // This mirror exists specifically to satisfy providers that require a
      // user turn at the end. Do this before character/context checks: fixed
      // stage embeds can expose an incomplete context while the payload is
      // already fully assembled.
      ensureTrailingTemporaryUserTurn(eventData.chat);
      removeCurrentTransactionalDuplicateUserPrompt(eventData.chat, pendingRequestId);
      const contextInfo = getCurrentContextInfo();
      const characterName = contextInfo.character?.name || '';
      const isHatsu = characterName.includes('初星学园') || characterName.includes('初星') || characterName.includes('Hatsuboshi');
      if (!isHatsu) return;

      const lastHatsuUserPromptIndex = eventData.chat.reduce((lastIndex, message, index) => {
        return isHatsuFrontendPromptMessage(message) ? index : lastIndex;
      }, -1);
      if (lastHatsuUserPromptIndex === -1) return;

      const filtered = eventData.chat.filter((message, index) => {
        return !isHatsuFrontendPromptMessage(message) || index === lastHatsuUserPromptIndex;
      });
      eventData.chat.splice(0, eventData.chat.length, ...filtered);
      ensureTrailingTemporaryUserTurn(eventData.chat);
    }

    function resolveReplyAck(data, activeRequestId) {
      if (!data?.requestId || data.requestId !== activeRequestId) return 'ignore';
      if (data.accepted) {
        return data.isFinal !== false ? 'accept' : 'ignore';
      }
      return data.retry ? 'retry' : 'cancel';
    }

    function handleReplyAck(data) {
      const resolution = resolveReplyAck(data, pendingRequestId);
      if (resolution === 'ignore') return;
      if (resolution === 'accept' || resolution === 'cancel') {
        clearPendingReplyRequest();
        return;
      }
      pendingCandidateInFlight = false;
      scheduleReplyRetry(pendingCandidateMessageId);
    }

    function scheduleReplyRetry(messageId, delay = 600, emptyReason = '') {
      if (!pendingRequestId) return;
      if (!Number.isInteger(Number(messageId)) || Number(messageId) < 0) return;
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = window.setTimeout(() => {
        pendingReplyRetryTimer = 0;
        pendingCandidateInFlight = false;
        collectAndSendAiReply(Number(messageId), true, { emptyReason });
      }, delay);
    }

    function clearReplyCandidateState() {
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = 0;
      clearStreamFinalizeTimer();
      pendingCandidateInFlight = false;
      pendingCandidateMessageId = -1;
      pendingEmptyFinalRetryCount = 0;
    }

    function clearPendingReplyRequest() {
      clearReplyCandidateState();
      transactionalReplyRequestId = '';
      pendingPromptSentAt = 0;
      pendingPromptChatLength = 0;
      pendingRequestId = '';
      pendingChannelLeaseId = '';
    }
  } catch (err) {
    document.getElementById('hatsu-fullscreen-overlay')?.remove();
    showError(err);
  }
})();
</script>
