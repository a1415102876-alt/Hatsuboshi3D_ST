<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5dfc1">
  <title>初星主页样板</title>
  <link rel="stylesheet" href="./beat-player.css?v=20261024-idle-chat-v2">
  <link rel="stylesheet" href="./free-chat.css?v=20261025-home-hub-v1">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body class="free-chat home-hub">
  <main class="home-app">
    <header class="home-topbar">
      <div class="home-brand">
        <span class="home-brand-mark"><small>PLv</small><strong>79</strong></span>
        <div>
          <p class="home-eyebrow">HATSUBOSHI / HOME</p>
          <h1>初星学园</h1>
        </div>
      </div>
      <div class="home-resource-row" aria-label="资源概览">
        <span class="home-resource-chip"><b>活动经费</b><strong>100/100</strong><i>＋</i></span>
        <span class="home-resource-chip"><b>宝石</b><strong>1,130</strong><i>＋</i></span>
      </div>
      <div class="home-profile-tools">
        <label class="home-idol-picker" for="chatIdolSelect"><span>担当</span>
          <select id="chatIdolSelect" aria-label="选择担当偶像">
            <option value="kotone">藤田琴音</option>
            <option value="hski">花海咲季</option>
            <option value="ttmr">月村手毬</option>
            <option value="hume">花海佑芽</option>
            <option value="mao">有村麻央</option>
            <option value="kcna">仓本千奈</option>
            <option value="kllj">葛城莉莉娅</option>
            <option value="ssmk">紫云清夏</option>
            <option value="shro">筱泽广</option>
            <option value="hrnm">姬崎莉波</option>
            <option value="jsna">十王星南</option>
            <option value="hmsz">秦谷美铃</option>
            <option value="atbm">雨夜燕</option>
          </select>
        </label>
        <button id="homeSettingsBtn" class="home-round-button" type="button" aria-label="打开闲聊设置">设</button>
      </div>
    </header>

    <section class="home-viewport" aria-label="初星主页">
      <div id="beatStage" class="beat-stage home-stage" data-shot="medium" aria-label="家·教室三维场景">
        <div id="beatBackground" class="beat-background" aria-hidden="true"></div>
        <div class="stage-light stage-light-left"></div>
        <div class="stage-light stage-light-right"></div>
        <div class="stage-floor"></div>
        <div class="stage-vignette"></div>

        <div class="home-notice home-notice-left" aria-label="主页状态">
          <span class="home-notice-dot"></span>
          <span id="chatStatus">正在准备主页场景…</span>
        </div>
        <div class="home-banner" aria-label="活动公告">
          <span class="home-banner-label">本日限定</span>
          <strong>和担当一起<br>完成新的课题</strong>
          <small>NEW / 主页样板</small>
        </div>

        <div class="home-side-actions home-side-left" aria-label="左侧主页入口">
          <button class="home-action-button home-action-bond" type="button" data-home-action="bond" data-home-label="亲密度"><span class="home-action-icon">心</span><b>亲密度</b></button>
          <button class="home-action-button home-action-money" type="button" data-home-action="money" data-home-label="活动经费"><span class="home-action-icon">币</span><b>活动经费</b><em>1%</em></button>
          <button class="home-action-button home-action-work" type="button" data-home-action="work" data-home-label="工作"><span class="home-action-icon">工</span><b>工作</b><i>完成</i></button>
          <button class="home-action-button home-action-event" type="button" data-home-action="event" data-home-label="活动"><span class="home-action-icon">新</span><b>活动</b><i>NEW</i></button>
        </div>

        <div class="home-side-actions home-side-right" aria-label="右侧主页入口">
          <button class="home-action-button home-action-gift" type="button" data-home-action="gift" data-home-label="礼物"><span class="home-action-icon">礼</span><b>礼物</b><i>1</i></button>
          <button class="home-action-button home-action-task" type="button" data-home-action="task" data-home-label="任务"><span class="home-action-icon">任</span><b>任务</b><i>1</i></button>
          <button class="home-action-button home-action-achievement" type="button" data-home-action="achievement" data-home-label="成就"><span class="home-action-icon">成</span><b>成就</b></button>
          <button class="home-action-button home-action-ticket" type="button" data-home-action="ticket" data-home-label="通票"><span class="home-action-icon">券</span><b>通票</b></button>
        </div>

        <div class="home-producer-card" aria-label="育成状态">
          <span class="home-producer-orbit"></span>
          <div><small>担当育成中</small><strong id="homeIdolName">藤田琴音</strong><span>18 日目 · 家·教室</span></div>
          <button class="home-card-button" type="button" data-home-action="chat" data-home-label="担当闲聊">聊</button>
        </div>

        <div class="story-chrome home-story-chrome">
          <div id="beatDialogueCard" class="dialogue-card home-dialogue-card" tabindex="0" aria-label="对话框，点击或按回车进入下一段">
            <img id="beatSpeakerPortrait" class="beat-speaker-portrait" hidden alt="" draggable="false">
            <div class="speaker-plate"><strong id="beatSpeaker">藤田琴音</strong></div>
            <p id="beatText">……</p>
            <button id="advanceBeatBtn" class="dialogue-advance" type="button" aria-label="下一段"></button>
          </div>
          <div id="beatChoices" class="beat-choices" hidden><div id="beatChoiceList" class="beat-choice-list"></div></div>
          <div class="player-toolbar home-toolbar" aria-label="播放控制">
            <button id="previousBeatBtn" class="toolbar-button" type="button" aria-label="上一段">上</button>
            <button id="playBeatBtn" class="toolbar-button play" type="button" aria-pressed="false">播</button>
            <button id="nextBeatBtn" class="toolbar-button" type="button" aria-label="下一段">下</button>
            <button id="stopBeatBtn" class="toolbar-button quiet" type="button">停</button>
            <label class="auto-toggle"><input id="beatAutoPlay" type="checkbox" checked><span>自动</span></label>
          </div>
        </div>

        <nav class="home-bottom-actions" aria-label="主页底部入口">
          <button type="button" data-home-action="conversation" data-home-label="交流"><span>交</span><b>交流</b></button>
          <button type="button" data-home-action="idol" data-home-label="偶像"><span>偶</span><b>偶像</b><i></i></button>
          <button class="is-active" type="button" data-home-action="home" data-home-label="主页"><span>初</span><b>主页</b></button>
          <button type="button" data-home-action="arena" data-home-label="竞技场"><span>竞</span><b>竞技场</b><i></i></button>
          <button type="button" data-home-action="shop" data-home-label="商店"><span>店</span><b>商店</b></button>
        </nav>

        <div class="home-corner-actions">
          <button type="button" data-home-action="info" data-home-label="主页说明">i</button>
          <button type="button" data-home-action="menu" data-home-label="菜单">≡</button>
        </div>
      </div>
    </section>

    <section id="chatEditorPanel" class="home-chat-drawer" hidden aria-label="担当闲聊">
      <div class="home-drawer-heading"><div><span class="home-eyebrow">IDOL CHAT</span><h2>和担当闲聊</h2></div><button id="homeChatClose" type="button" aria-label="关闭闲聊">×</button></div>
      <div id="chatLog" class="chat-log" aria-live="polite"><div class="chat-log-empty">选择一个主页入口，或者直接输入想说的话。</div></div>
      <div id="beatChatComposer" class="chat-composer">
        <label class="chat-field-label" for="chatInput">发送消息</label>
        <textarea id="chatInput" rows="2" maxlength="1200" placeholder="例如：今天的练习顺利吗？" aria-label="闲聊输入"></textarea>
        <div class="chat-composer-actions"><button id="clearChatBtn" class="button secondary" type="button">清空</button><button id="sendChatBtn" class="button primary" type="button">发送</button></div>
      </div>
    </section>

    <details id="chatSettings" class="home-settings-panel">
      <summary>闲聊设置</summary>
      <div class="chat-settings-body">
        <label class="chat-field-label" for="chatApiBase">API 地址</label>
        <input id="chatApiBase" class="chat-setting-input" type="url" placeholder="https://example.com/v1" autocomplete="off" spellcheck="false">
        <div class="chat-settings-grid"><div><label class="chat-field-label" for="chatApiModel">模型</label><input id="chatApiModel" class="chat-setting-input" type="text" placeholder="模型名" autocomplete="off" spellcheck="false"></div><div><label class="chat-field-label" for="chatApiKey">密钥</label><input id="chatApiKey" class="chat-setting-input" type="password" placeholder="只保存在本机" autocomplete="off"></div></div>
        <div class="chat-settings-grid"><div><label class="chat-field-label" for="chatApiTemperature">温度</label><input id="chatApiTemperature" class="chat-setting-input" type="number" min="0" max="2" step="0.1" value="0.8"></div><div><label class="chat-field-label" for="chatApiMaxTokens">最大输出</label><input id="chatApiMaxTokens" class="chat-setting-input" type="number" min="64" max="4000" step="1" value="800"></div></div>
        <label class="chat-toggle" for="chatTtsEnabled"><input id="chatTtsEnabled" type="checkbox"><span>启用角色语音</span></label>
        <label class="chat-field-label" for="chatTtsApiKey">Fish API Key</label><input id="chatTtsApiKey" class="chat-setting-input" type="password" placeholder="只保存在本机，与育成页共用" autocomplete="off">
        <p id="chatTtsStatus" class="chat-settings-note" role="status">角色语音未接通。</p>
        <label class="chat-field-label" for="chatSystemPrompt">对话预设</label><textarea id="chatSystemPrompt" class="chat-setting-text" spellcheck="false"></textarea>
        <label class="chat-field-label" for="chatWorldbook">补充世界书</label><textarea id="chatWorldbook" class="chat-setting-text" spellcheck="false" placeholder="常驻：始终插入的设定&#10;---&#10;关键词：练习、课程&#10;命中任一关键词时插入的内容"></textarea>
        <p id="chatWorldbookStatus" class="chat-settings-note" role="status">正在读取酒馆世界书「初星学园」。</p>
      </div>
    </details>
  </main>

  <div class="free-chat-support"><textarea id="beatScript"></textarea><span id="beatProgress"></span><span id="beatShot">镜头：home-home</span><span id="beatStatus">等待主页。</span><ul id="beatDiagnostics"></ul></div>
  <div id="homeToast" class="home-toast" role="status" aria-live="polite"></div>
  <script src="../hatsu-produce-local/fish-tts.js?v=20261027-name-dict-v1"></script>
  <script type="module" src="./free-chat.js?v=20261028-block-boxes-v1"></script>
</body>
</html>
